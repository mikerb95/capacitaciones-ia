<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F7F5; --surface:#FFFFFF; --surface2:#EAF2EE; --border:#D8E4DE;
  --text:#0D1714; --muted:#546A63; --faint:#7E938B;
  --primary:#0E7C63; --primary-strong:#095A48; --primary-soft:#DDF1EA;
  --accent:#2B6FE3; --accent-soft:#E2ECFD;
  --shadow:0 1px 2px rgba(12,40,32,.06),0 8px 24px rgba(12,40,32,.06);
  --shadow-lift:0 2px 4px rgba(12,40,32,.08),0 18px 40px rgba(14,124,99,.16);
}
body[data-theme="dark"]{
  --bg:#0A1210; --surface:#121B18; --surface2:#182421; --border:#26352F;
  --text:#E9F2EE; --muted:#A0B3AC; --faint:#7E938B;
  --primary:#3FBFA0; --primary-strong:#6FD6BC; --primary-soft:#123329;
  --accent:#6FA8FF; --accent-soft:#132744;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  --shadow-lift:0 2px 6px rgba(0,0,0,.45),0 20px 44px rgba(0,0,0,.5);
}
body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',Segoe UI,system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background .28s ease,color .28s ease}
a{color:var(--primary);text-decoration:none}
a:hover{color:var(--primary-strong);text-decoration:underline}
::selection{background:var(--primary-soft);color:var(--text)}
@keyframes pulseDot{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</helmet>

<dc-import name="PortalBase" tool="{{ tool }}" hint-size="100%,100vh"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
const CO = {a:'#0E7C63', b:'#2B6FE3', c:'#8A5CD1', d:'#C2760C', e:'#B0396B', f:'#3E7A8C'};

// Esqueleto: títulos y estructura. El contenido de cada sección se itera aparte.
function mod(id, shortName, abbr, color, name, level, summary, intro) {
  return {
    id, shortName, abbr, color, name, level, summary, intro,
    meta:'por definir',
    outcomes:['Objetivo 1 del módulo', 'Objetivo 2 del módulo', 'Objetivo 3 del módulo'],
    prompts:[{tag:'Por definir', text:'Prompt pendiente de redactar.'}],
    baIntro:'Caso de la sesión: pendiente.',
    before:'Situación actual: pendiente.', beforeTime:'—',
    after:'Con la herramienta: pendiente.', afterTime:'—',
    steps:[{title:'Paso 1', desc:'Pendiente.'}, {title:'Paso 2', desc:'Pendiente.'}, {title:'Paso 3', desc:'Pendiente.'}, {title:'Paso 4', desc:'Pendiente.'}],
    roles:[{rol:'Área', task:'Caso de uso', detail:'Pendiente.'}],
    mistakes:[{bad:'Error frecuente pendiente.', good:'Práctica correcta pendiente.'}],
    mockTitle:name, mockPrompt:'Prompt de ejemplo pendiente.', mockReply:'Respuesta de ejemplo pendiente.',
    mockPanelTitle:'Panel', mockPanel:'Pendiente'
  };
}

const MODULES = [
  mod('canvas','Canvas','CV',CO.a,'Canvas','Básico','Editor al lado del chat para documentos y código: se corrige por selección, no por mensajes.','Un documento vivo con control de versiones dentro de la conversación.'),
  mod('voice','Voice','VZ',CO.b,'Modo voz','Básico','Conversación hablada para consultar, dictar y ensayar sin teclado.','Útil en ruta, en sitio y para practicar una llamada antes de hacerla.'),
  mod('gpts','GPTs','GP',CO.c,'GPTs personalizados','Intermedio','Asistentes propios por tarea, con instrucciones y archivos de la empresa.','Se configuran una vez y los usa todo el equipo con el mismo criterio.'),
  mod('deep','Deep Research','DR',CO.d,'Deep Research','Intermedio','Informes largos con fuentes sobre mercado, competencia o normativa.','Investigación autónoma con citas, para sustentar decisiones de comité.'),
  mod('agent','Agent Mode','AG',CO.e,'Agent Mode','Avanzado','El asistente ejecuta tareas de varios pasos en el navegador y entrega el resultado.','Formularios, comparaciones y trámites web que hoy se hacen a mano.'),
  mod('codex','Codex','CX',CO.f,'Codex','Avanzado','Automatización de tareas de archivos, datos y desarrollo desde el entorno de trabajo.','Consolidar, limpiar y generar reportes repetibles sin hacerlo a mano cada mes.'),
  mod('images','Images','IG',CO.b,'Imágenes','Básico','Generación y edición de imágenes para piezas internas y material de apoyo.','Fondos, íconos y mockups sin depender de un banco de fotos.'),
  mod('sora','Sora','SR',CO.c,'Video con Sora','Avanzado','Video corto para capacitación, redes o demostración de una idea.','Piezas de pocos segundos a partir de un guion propio.')
];

class Component extends DCLogic {
  renderVals() {
    return {
      tool: {
        key:'chatgpt', name:'ChatGPT', portalName:'Portal ChatGPT', initial:'G',
        tagline:'Capacitación interna', inputHint:'Escríbele a ChatGPT…',
        badge:'Programa interno · 8 módulos · en el orden que quieras',
        heroTitle:'Aprende a usar ChatGPT en el trabajo del día a día',
        heroText:'Canvas, voz, GPTs propios, investigación con fuentes y agentes que ejecutan tareas, con los casos de siempre.',
        stats:[
          {n:'8', label:'módulos, uno por capacidad'},
          {n:'—', label:'prompts (por definir)'},
          {n:'—', label:'casos de uso por área'},
          {n:'3', label:'niveles: básico, intermedio y avanzado'}
        ],
        specialTitle:'Lo que solo se hace acá',
        specialIntro:'Los tres diferenciales de ChatGPT frente a los otros portales de la academia. Contenido por afinar.',
        special:[
          {kicker:'GPTs', title:'Asistentes propios por tarea', desc:'Instrucciones y archivos de la empresa, compartidos con el área.', example:'Pendiente de redactar.'},
          {kicker:'Agent Mode', title:'Ejecuta, no solo responde', desc:'Tareas de varios pasos en el navegador con resultado verificable.', example:'Pendiente de redactar.'},
          {kicker:'Voz', title:'Conversación sin teclado', desc:'Consultar y dictar en ruta o en sitio.', example:'Pendiente de redactar.'}
        ],
        downloads:[
          {title:'Guía de prompts', desc:'Pendiente de armar.', meta:'PDF'},
          {title:'Plantilla de GPT', desc:'Pendiente de armar.', meta:'DOCX'},
          {title:'Checklist de revisión', desc:'Pendiente de armar.', meta:'PDF'}
        ],
        practices:[
          {n:'01', title:'Di para quién es antes de pedir', desc:'Pendiente de redactar.'},
          {n:'02', title:'Corrige, no arranques otra vez', desc:'Pendiente de redactar.'},
          {n:'03', title:'Exige la fuente', desc:'Pendiente de redactar.'},
          {n:'04', title:'Guarda lo que te funcionó', desc:'Pendiente de redactar.'}
        ],
        faqs:[
          {q:'¿ChatGPT ve los archivos de la empresa?', a:'Pendiente de redactar.'},
          {q:'¿Lo que escribimos entrena el modelo?', a:'Pendiente de redactar.'},
          {q:'¿Puedo confiar en las cifras que genera?', a:'Pendiente de redactar.'},
          {q:'¿En qué se diferencia de los otros portales?', a:'Pendiente de redactar.'}
        ],
        links:[
          {label:'Ayuda de ChatGPT', href:'https://help.openai.com'},
          {label:'GPTs personalizados', href:'https://help.openai.com'},
          {label:'ChatGPT para empresas', href:'https://openai.com/business'}
        ],
        helpTitle:'¿Dudas durante la práctica?',
        helpText:'Escribe al canal #academia-ia. Contestamos en horario de oficina.',
        modules: MODULES
      }
    };
  }
}
</script>
</body>
</html>
