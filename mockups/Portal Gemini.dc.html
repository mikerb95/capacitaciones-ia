<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6FC; --surface:#FFFFFF; --surface2:#EDF1FB; --border:#DCE3F3;
  --text:#101426; --muted:#565F7A; --faint:#8189A3;
  --primary:#3B5BDB; --primary-strong:#2A3F9E; --primary-soft:#E5EAFD;
  --accent:#0FA97A; --accent-soft:#DCF6EC;
  --shadow:0 1px 2px rgba(20,26,56,.06),0 8px 24px rgba(20,26,56,.06);
  --shadow-lift:0 2px 4px rgba(20,26,56,.08),0 18px 40px rgba(59,91,219,.16);
}
body[data-theme="dark"]{
  --bg:#0B0E1A; --surface:#141828; --surface2:#1B2133; --border:#2A3149;
  --text:#EBEEF8; --muted:#A2AAC4; --faint:#7F87A3;
  --primary:#7D97FF; --primary-strong:#A5B6FF; --primary-soft:#1C2547;
  --accent:#2FD3A0; --accent-soft:#0F3A2E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  --shadow-lift:0 2px 6px rgba(0,0,0,.45),0 20px 44px rgba(0,0,0,.5);
}
body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',Segoe UI,system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background .28s ease,color .28s ease}
a{color:var(--primary);text-decoration:none}
a:hover{color:var(--primary-strong);text-decoration:underline}
::selection{background:var(--primary-soft);color:var(--text)}
@keyframes pulseDot{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</helmet>

<dc-import name="PortalBase" tool="{{ tool }}" hint-size="100%,100vh"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
const CO = {a:'#3B5BDB', b:'#8A5CD1', c:'#1E8E7E', d:'#C2760C', e:'#B0396B', f:'#3D7BC4'};

// Esqueleto: títulos y estructura. El contenido de cada sección se itera aparte.
function mod(id, shortName, abbr, color, name, level, summary, intro) {
  return {
    id, shortName, abbr, color, name, level, summary, intro,
    meta:'por definir',
    outcomes:['Objetivo 1 del módulo', 'Objetivo 2 del módulo', 'Objetivo 3 del módulo'],
    prompts:[{tag:'Por definir', text:'Prompt pendiente de redactar.'}],
    baIntro:'Caso de la sesión: pendiente.',
    before:'Situación actual: pendiente.', beforeTime:'—',
    after:'Con la herramienta: pendiente.', afterTime:'—',
    steps:[{title:'Paso 1', desc:'Pendiente.'}, {title:'Paso 2', desc:'Pendiente.'}, {title:'Paso 3', desc:'Pendiente.'}, {title:'Paso 4', desc:'Pendiente.'}],
    roles:[{rol:'Área', task:'Caso de uso', detail:'Pendiente.'}],
    mistakes:[{bad:'Error frecuente pendiente.', good:'Práctica correcta pendiente.'}],
    mockTitle:name, mockPrompt:'Prompt de ejemplo pendiente.', mockReply:'Respuesta de ejemplo pendiente.',
    mockPanelTitle:'Panel', mockPanel:'Pendiente'
  };
}

const MODULES = [
  mod('live','Live','LV',CO.a,'Gemini Live','Básico','Conversación en voz y con cámara para trabajar con las manos ocupadas o mostrar lo que se tiene al frente.','Voz y cámara en tiempo real: consultar en sitio, ensayar una conversación difícil o dictar compromisos en ruta.'),
  mod('deep','Deep Research','DR',CO.b,'Deep Research','Intermedio','Informes largos con fuentes citadas sobre mercado, competencia o regulación.','Investigación autónoma sobre decenas de fuentes, con citas y fecha por dato.'),
  mod('canvas','Canvas','CV',CO.c,'Canvas','Básico','Espacio de edición al lado del chat para escribir documentos largos y corregir por secciones.','Un solo documento vivo en vez de veinte mensajes sueltos.'),
  mod('gems','Gems','GM',CO.d,'Gems','Intermedio','Asistentes propios con instrucciones fijas para las tareas que se repiten en el área.','Configurado una vez, usado por todo el equipo con el mismo tono y los mismos límites.'),
  mod('notebook','NotebookLM','NB',CO.e,'NotebookLM','Intermedio','Un cuaderno con tus fuentes: preguntas sobre tus documentos con la cita exacta.','Manuales, actas y expedientes consultables por pregunta, con el fragmento que sustenta cada respuesta.'),
  mod('imagen','Imagen','IM',CO.f,'Imágenes con Imagen','Básico','Generación y edición de imágenes para piezas internas y material de apoyo.','Fondos, íconos y escenas de apoyo sin depender de un banco de fotos genérico.'),
  mod('veo','Veo','VE',CO.b,'Video con Veo','Avanzado','Video corto para capacitación interna, redes o demostración de producto.','Piezas de pocos segundos con guion propio, para lo que hoy no alcanza el presupuesto de producción.'),
  mod('workspace','Workspace','WS',CO.a,'Gemini en Workspace','Intermedio','Gemini dentro de Gmail, Docs, Sheets, Slides y Meet, sobre los archivos que ya existen.','El asistente donde ya trabaja el equipo, con los permisos que cada quien tiene en Drive.')
];

class Component extends DCLogic {
  renderVals() {
    return {
      tool: {
        key:'gemini', name:'Gemini', portalName:'Portal Gemini', initial:'G',
        tagline:'Capacitación interna', inputHint:'Escríbele a Gemini…',
        badge:'Programa interno · 8 módulos · en el orden que quieras',
        heroTitle:'Aprende a usar Gemini en el trabajo del día a día',
        heroText:'Voz y cámara, investigación con fuentes, cuadernos de documentos y Gemini dentro de Workspace, con los casos de siempre.',
        stats:[
          {n:'8', label:'módulos, uno por capacidad'},
          {n:'—', label:'prompts (por definir)'},
          {n:'—', label:'casos de uso por área'},
          {n:'3', label:'niveles: básico, intermedio y avanzado'}
        ],
        specialTitle:'Lo que solo se hace acá',
        specialIntro:'Los tres diferenciales de Gemini frente a los otros portales de la academia. Contenido por afinar.',
        special:[
          {kicker:'Live', title:'Voz y cámara en tiempo real', desc:'Trabajar sin teclado: en bodega, en obra o en ruta.', example:'Pendiente de redactar.'},
          {kicker:'Workspace', title:'Dentro de Gmail, Docs y Sheets', desc:'El asistente en las herramientas donde ya está el trabajo.', example:'Pendiente de redactar.'},
          {kicker:'NotebookLM', title:'Respuestas con la cita del documento', desc:'Cuadernos por tema con fuentes propias.', example:'Pendiente de redactar.'}
        ],
        downloads:[
          {title:'Guía de prompts', desc:'Pendiente de armar.', meta:'PDF'},
          {title:'Plantilla de Gem', desc:'Pendiente de armar.', meta:'DOCX'},
          {title:'Checklist de Workspace', desc:'Pendiente de armar.', meta:'PDF'}
        ],
        practices:[
          {n:'01', title:'Di para quién es antes de pedir', desc:'Pendiente de redactar.'},
          {n:'02', title:'Corrige, no arranques otra vez', desc:'Pendiente de redactar.'},
          {n:'03', title:'Exige la fuente', desc:'Pendiente de redactar.'},
          {n:'04', title:'Guarda lo que te funcionó', desc:'Pendiente de redactar.'}
        ],
        faqs:[
          {q:'¿Gemini ve los archivos de Drive?', a:'Pendiente de redactar.'},
          {q:'¿Lo que escribimos entrena el modelo?', a:'Pendiente de redactar.'},
          {q:'¿Puedo confiar en las cifras que genera?', a:'Pendiente de redactar.'},
          {q:'¿En qué se diferencia de los otros portales?', a:'Pendiente de redactar.'}
        ],
        links:[
          {label:'Ayuda de Gemini', href:'https://support.google.com/gemini'},
          {label:'Gemini en Workspace', href:'https://workspace.google.com'},
          {label:'NotebookLM', href:'https://notebooklm.google.com'}
        ],
        helpTitle:'¿Dudas durante la práctica?',
        helpText:'Escribe al canal #academia-ia. Contestamos en horario de oficina.',
        modules: MODULES
      }
    };
  }
}
</script>
</body>
</html>
